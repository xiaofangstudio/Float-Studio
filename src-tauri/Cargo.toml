[package]
name = "floatstudio"
version = "0.1.0"
description = "Float Studio：Copper 语言与 Copper UI 的一体化开发环境"
authors = ["小方工作室"]
license = "MIT"
edition = "2021"
rust-version = "1.75"

[lib]
name = "floatstudio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.14"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
base64 = "0.22"
portable-pty = "0.8"
# 取网页 / 发网页 的 HTTP 实现（内核保持零依赖，网络能力在这里注入）
ureq = "2"
# Copper 语言内核：IDE 的运行（F5）走这条，比旧解释器快 4~5 倍
# 语言内核已独立到 Copper 仓库；本地开发时指向同级 fangui/FangUI 下的副本
float-lang = { path = "../../fangui/FangUI/rust/float-lang" }

[profile.release]
opt-level = 2
lto = false

# Windows 文件关联走系统 API（RegCreateKeyW / SHChangeNotify），不调用 reg.exe
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
